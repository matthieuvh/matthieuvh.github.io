<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🥗 Recettes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d9f6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recettes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --primary: #2d9f6b;
    --primary-light: #e8f5ee;
    --accent: #f59e0b;
    --bg: #f8faf8;
    --card-bg: #fff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e0e8e4;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding-bottom: var(--safe-bottom); }

  /* ── HEADER ── */
  header {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 12px 20px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 1.2rem; font-weight: 700; flex: 0 0 auto; white-space: nowrap; }
  .search-bar {
    flex: 1; min-width: 160px; max-width: 320px;
    padding: 7px 14px; border: 1.5px solid var(--border);
    border-radius: 20px; font-size: 14px; outline: none;
  }
  .search-bar:focus { border-color: var(--primary); }

  /* ── MEAL TABS ── */
  .meal-tabs {
    display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
  }
  .meal-tab {
    padding: 6px 14px; border: 1.5px solid var(--border); border-radius: 20px;
    background: #fff; font-size: 13px; cursor: pointer; transition: all .15s;
    font-weight: 500;
  }
  .meal-tab.active-all  { background: var(--primary); color: #fff; border-color: var(--primary); }
  .meal-tab.active-matin { background: #f59e0b; color: #fff; border-color: #f59e0b; }
  .meal-tab.active-midi  { background: #43a047; color: #fff; border-color: #43a047; }
  .meal-tab.active-soir  { background: #3949ab; color: #fff; border-color: #3949ab; }

  /* ── FILTER ROW ── */
  .filter-row {
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    padding: 8px 20px; background: #fff; border-bottom: 1px solid var(--border);
  }
  .filter-btn {
    padding: 5px 12px; border: 1.5px solid var(--border); border-radius: 14px;
    background: #fff; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .filter-btn.ai-active { background: #16a34a; color: #fff; border-color: #16a34a; }
  .filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
  .count-badge { font-size: 12px; color: var(--muted); margin-left: auto; }
  .sort-select {
    padding: 5px 10px; border: 1.5px solid var(--border); border-radius: 14px;
    background: #fff; font-size: 12px; cursor: pointer; outline: none; color: var(--text);
  }
  .sort-select:focus { border-color: var(--primary); }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px; padding: 16px 20px; max-width: 1400px; margin: 0 auto;
  }

  /* ── CARD ── */
  .card {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; cursor: pointer;
    transition: transform .15s, box-shadow .15s; position: relative;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.11); }

  .card-img {
    width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #e8f5ee;
    display: block;
  }
  .card-placeholder {
    width: 100%; aspect-ratio: 4/3; display: flex; align-items: center;
    justify-content: center; font-size: 2.5rem;
  }
  .card-num {
    position: absolute; bottom: 8px; left: 8px; z-index: 2;
    background: rgba(0,0,0,0.45); color: #fff; font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 7px; backdrop-filter: blur(2px);
  }
  .ai-badge {
    position: absolute; bottom: 8px; right: 8px; z-index: 2;
    background: #16a34a; color: #fff; font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 6px; letter-spacing: 0.3px;
  }
  .meal-dot {
    position: absolute; bottom: 8px; right: 8px; z-index: 2;
    width: 22px; height: 22px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 12px;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(4px);
  }
  .fav-btn {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    background: rgba(255,255,255,0.85); border: none; border-radius: 50%;
    width: 30px; height: 30px; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); transition: transform .15s;
  }
  .fav-btn:hover { transform: scale(1.2); }
  .fav-btn.on { background: #fee; }

  .card-body { padding: 10px 12px 12px; }
  .card-title { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; }
  .card-meta { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .tag {
    display: inline-flex; align-items: center;
    padding: 2px 7px; border-radius: 7px; font-size: 11px; white-space: nowrap;
  }
  .tag-time  { background: #fff3ee; color: #c05621; }
  .tag-price { background: #f0f7f0; color: #2a7a2a; }
  .tag-rating { background: #fffbee; color: #b8860b; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 100;
    align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; max-width: 680px; width: 100%;
    max-height: 90vh; overflow-y: auto; animation: slideUp .2s ease;
    transition: transform .22s ease;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(16px);} to {opacity:1; transform:none;} }
  .modal-img-wrap { position: relative; }
  .modal-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  .modal-img-placeholder {
    width: 100%; aspect-ratio: 16/9; display: flex; align-items: center;
    justify-content: center; font-size: 4rem;
  }
  .modal-meal-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 6px 16px; font-size: 12px; font-weight: 600; color: #fff;
    backdrop-filter: blur(8px);
  }
  .modal-content { padding: 18px 20px 20px; }
  .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
  .modal-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .badge {
    padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
  }
  .badge-ai { background: #dcfce7; color: #166534; }
  .modal-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
  .modal-section { margin-bottom: 14px; }
  .modal-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--primary); }
  .ing-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .ing-item {
    font-size: 13px; padding: 5px 8px; background: var(--bg);
    border-radius: 7px; display: flex; justify-content: space-between; align-items: center; gap: 4px;
  }
  .ing-qty { font-weight: 600; color: var(--primary); white-space: nowrap; font-size: 12px; }
  .ing-opt { font-size: 10px; color: var(--muted); }
  .steps-list { list-style: none; counter-reset: step; }
  .step-item {
    counter-increment: step; font-size: 13px; line-height: 1.5;
    padding: 8px 8px 8px 36px; position: relative; border-bottom: 1px solid var(--border);
  }
  .step-item:last-child { border-bottom: none; }
  .step-item::before {
    content: counter(step); position: absolute; left: 6px; top: 8px;
    width: 22px; height: 22px; border-radius: 50%; background: var(--primary-light);
    color: var(--primary); font-weight: 700; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .btn {
    padding: 9px 18px; border-radius: 20px; border: none; font-size: 13px;
    font-weight: 600; cursor: pointer; transition: opacity .15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { opacity: 0.88; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-outline { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; }

  /* ── BOTTOM NAV (mobile) ── */
  .bottom-nav {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 25;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    grid-template-columns: repeat(4, 1fr);
  }
  .bnav-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 4px 6px; gap: 2px;
    border: none; background: none; cursor: pointer;
    color: var(--muted); font-size: 10px; font-weight: 500;
    transition: color .15s;
  }
  .bnav-btn .bi { font-size: 22px; line-height: 1; }
  .bnav-btn.active { color: var(--primary); }
  .bnav-btn.active-matin { color: #f59e0b; }
  .bnav-btn.active-midi  { color: #43a047; }
  .bnav-btn.active-soir  { color: #3949ab; }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    .bottom-nav { display: grid; }
    .meal-tabs { display: none; }
    body { padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
    header { padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 1rem; }
    .search-bar { font-size: 16px; min-width: 0; max-width: none; flex: 1; }
    .filter-row {
      padding: 6px 12px; gap: 4px;
      overflow-x: auto; flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-row > div:first-child { flex-wrap: nowrap; gap: 4px; }
    .filter-row > div:last-child { flex-shrink: 0; }
    .filter-sep { display: none; }
    .filter-btn { padding: 5px 10px; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
    .sort-select { font-size: 12px; padding: 5px 8px; }
    .count-badge { display: none; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; }
    .card-title { font-size: 11px; line-height: 1.3; }
    .card-meta { gap: 3px; }
    .tag { font-size: 10px; padding: 2px 5px; }
    .card-body { padding: 5px 6px 7px; }
    .card-num { font-size: 10px; padding: 2px 5px; }
    .ai-badge { font-size: 10px; padding: 2px 5px; }
    .modal { border-radius: 20px 20px 0 0; max-height: 92vh; }
    .modal-overlay { align-items: flex-end; padding: 0; }
    .ing-list { grid-template-columns: 1fr; }
    .modal-actions { gap: 8px; }
    .btn { padding: 10px 14px; font-size: 13px; }
  }
  @media (max-width: 380px) {
    .grid { gap: 8px; padding: 8px; }
    .card-num { font-size: 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>🥗 Recettes</h1>
  <input class="search-bar" id="search" type="search" placeholder="Chercher une recette ou #numéro…" autocomplete="off">
  <div class="meal-tabs">
    <button class="meal-tab active-all" data-meal="all">Tout</button>
    <button class="meal-tab" data-meal="matin">🌅 Matin</button>
    <button class="meal-tab" data-meal="midi">☀️ Midi</button>
    <button class="meal-tab" data-meal="soir">🌙 Soir</button>
  </div>
</header>

<div class="filter-row">
  <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;">
    <button class="filter-btn" id="btn-ai" onclick="toggleAI()">🌿 Anti-inflam</button>
    <div class="filter-sep"></div>
    <button class="filter-btn active" data-filter="time" data-max="9999">⏱ Tout</button>
    <button class="filter-btn" data-filter="time" data-max="15">≤ 15 min</button>
    <button class="filter-btn" data-filter="time" data-max="30">≤ 30 min</button>
    <div class="filter-sep"></div>
    <button class="filter-btn active" data-filter="price" data-price="all">€ Tout</button>
    <button class="filter-btn" data-filter="price" data-price="€">€</button>
    <button class="filter-btn" data-filter="price" data-price="€€">€€</button>
    <button class="filter-btn" data-filter="price" data-price="€€€">€€€</button>
    <div class="filter-sep"></div>
    <button class="filter-btn" id="btn-favs" onclick="toggleFavs()">❤️ Favoris</button>
  </div>
  <div style="display:flex;gap:8px;align-items:center;margin-left:auto;">
    <select class="sort-select" id="sort-select">
      <option value="default">Tri : défaut</option>
      <option value="time">Temps ↑</option>
      <option value="price">Prix ↑</option>
      <option value="ai">Anti-inflam ↓</option>
    </select>
    <span class="count-badge" id="count-badge">… recettes</span>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none;">Aucune recette trouvée</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-img-wrap" id="modal-img-wrap"></div>
    <div class="modal-content">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-badges" id="modal-badges"></div>
      <div class="modal-desc" id="modal-desc"></div>
      <div class="modal-section">
        <h3>Ingrédients <span style="font-weight:400;color:var(--muted);font-size:12px;">(pour 2 pers.)</span></h3>
        <ul class="ing-list" id="modal-ings"></ul>
      </div>
      <div class="modal-section" id="steps-section">
        <h3>Préparation</h3>
        <ol class="steps-list" id="modal-steps"></ol>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="modal-fav-btn" onclick="toggleModalFav()">❤️ Favori</button>
        <button class="btn btn-outline" onclick="closeModal()">✕ Fermer</button>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV (mobile) -->
<nav class="bottom-nav" id="bottom-nav">
  <button class="bnav-btn active" data-meal="all" onclick="setMealFromNav(this)">
    <span class="bi">🍽️</span>Tout
  </button>
  <button class="bnav-btn" data-meal="matin" onclick="setMealFromNav(this)">
    <span class="bi">🌅</span>Matin
  </button>
  <button class="bnav-btn" data-meal="midi" onclick="setMealFromNav(this)">
    <span class="bi">☀️</span>Midi
  </button>
  <button class="bnav-btn" data-meal="soir" onclick="setMealFromNav(this)">
    <span class="bi">🌙</span>Soir
  </button>
</nav>

<script src="data.js" defer></script>
<script>
// ── State ──────────────────────────────────
const FAV_KEY = 'ai_favs_v2';
let favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
let query = '';
let filterMeal = 'all';
let maxTime = 9999;
let filterPrice = 'all';
const AI_THRESHOLD = 4;  // Score MIND Diet minimum
let onlyAI = false;
let onlyFavs = false;
let sortMode = 'default';
let currentIdx = null;

function saveFavs(s) { localStorage.setItem(FAV_KEY, JSON.stringify([...s])); }

// ── Sorting ───────────────────────────────
const PRICE_ORDER = {'€':1,'€€':2,'€€€':3};
function sortedRecipes(arr) {
  if (sortMode === 'time')    return [...arr].sort((a,b) => a.totalTime - b.totalTime);
  if (sortMode === 'price')   return [...arr].sort((a,b) => (PRICE_ORDER[a.priceLabel]||2)-(PRICE_ORDER[b.priceLabel]||2));
  if (sortMode === 'ai')      return [...arr].sort((a,b) => b.ai_score - a.ai_score);
  return arr;
}

// ── Render ────────────────────────────────
const MEAL_META = {
  matin: { bg: '#fff8e1', color: '#f59e0b', icon: '🌅', label: 'Matin' },
  midi:  { bg: '#e8f5e9', color: '#43a047', icon: '☀️', label: 'Midi' },
  soir:  { bg: '#e8eaf6', color: '#3949ab', icon: '🌙', label: 'Soir' },
};

const PAGE_SIZE = 48;
let visibleList = [];
let loadedCount = 0;
let sentinel = null;
let sentinelObs = null;

function cardHtml(r) {
  const mm = MEAL_META[r.meal] || MEAL_META.midi;
  const isFav = favs.has(r.num);
  const imgSrc = r.thumb || r.image;
  const imgHtml = imgSrc
    ? `<img class="card-img" src="${imgSrc}" alt="${r.title}" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      + `<div class="card-placeholder" style="background:${mm.bg};display:none;">${mm.icon}</div>`
    : `<div class="card-placeholder" style="background:${mm.bg};">${mm.icon}</div>`;
  // Bas gauche : #num | Bas droite : score MIND (si filtre actif) ou badge EN
  const aiBadge = r.ai_score >= AI_THRESHOLD
    ? `<span class="ai-badge">🌿${r.ai_score}</span>` : '';
  const srcBadge = r.source === 'spoonacular' && r.ai_score < AI_THRESHOLD
    ? `<span class="ai-badge" style="background:rgba(59,130,246,0.85);">EN</span>`
    : r.source === 'yuka' && r.ai_score < AI_THRESHOLD
    ? `<span class="ai-badge" style="background:rgba(234,88,12,0.85);">Yuka</span>` : '';
  return `<div class="card" onclick="openModal(${r.num})">
    ${imgHtml}
    <span class="card-num">#${r.num}</span>
    ${aiBadge}${srcBadge}
    <button class="fav-btn ${isFav?'on':''}" onclick="event.stopPropagation();toggleFav(${r.num})" title="Favori">${isFav?'❤️':'🤍'}</button>
    <div class="card-body">
      <div class="card-title">${r.title}</div>
      <div class="card-meta">
        ${r.totalTime ? `<span class="tag tag-time">⏱ ${r.totalTime} min</span>` : ''}
        <span class="tag tag-price">${r.priceLabel}</span>
        ${r.rating >= 4 ? `<span class="tag tag-rating">★ ${r.rating}</span>` : ''}
      </div>
    </div>
  </div>`;
}

function renderCards() {
  const q = query.toLowerCase().trim();
  const isNumQ = /^#?(\d+)$/.test(q);
  const numQ = isNumQ ? parseInt(q.replace('#','')) : null;

  visibleList = RECIPES.filter(r => {
    if (filterMeal !== 'all' && r.meal !== filterMeal) return false;
    if (onlyAI && r.ai_score < AI_THRESHOLD) return false;
    if (maxTime < 9999 && r.totalTime > maxTime) return false;
    if (filterPrice !== 'all' && r.priceLabel !== filterPrice) return false;
    if (onlyFavs && !favs.has(r.num)) return false;
    if (q) {
      if (numQ !== null) return r.num === numQ;
      return r.title.toLowerCase().includes(q) || r.slug.includes(q);
    }
    return true;
  });
  visibleList = sortedRecipes(visibleList);
  loadedCount = 0;

  document.getElementById('count-badge').textContent = visibleList.length + ' recette' + (visibleList.length !== 1 ? 's' : '');
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  // Détacher l'ancien sentinel
  if (sentinelObs && sentinel) { sentinelObs.unobserve(sentinel); sentinel.remove(); sentinel = null; }

  if (!visibleList.length) { grid.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';

  grid.innerHTML = '';
  loadMore();
}

function loadMore() {
  const grid = document.getElementById('grid');
  const batch = visibleList.slice(loadedCount, loadedCount + PAGE_SIZE);
  const frag = document.createDocumentFragment();
  batch.forEach(r => {
    const div = document.createElement('div');
    div.innerHTML = cardHtml(r);
    frag.appendChild(div.firstElementChild);
  });
  if (sentinel) sentinel.remove();
  grid.appendChild(frag);
  loadedCount += batch.length;

  if (loadedCount < visibleList.length) {
    sentinel = document.createElement('div');
    sentinel.style.cssText = 'height:1px;grid-column:1/-1;';
    grid.appendChild(sentinel);
    if (!sentinelObs) {
      sentinelObs = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) loadMore();
      }, { rootMargin: '200px' });
    }
    sentinelObs.observe(sentinel);
  }
}

// ── Modal ─────────────────────────────────
function openModal(num) {
  const r = RECIPES.find(x => x.num === num);
  if (!r) return;
  currentIdx = num;
  const mm = MEAL_META[r.meal] || MEAL_META.midi;

  const wrap = document.getElementById('modal-img-wrap');
  if (r.image) {
    wrap.innerHTML = `<img class="modal-img" src="${r.image}" alt="${r.title}"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="modal-img-placeholder" style="background:${mm.bg};display:none;">${mm.icon}</div>
      <div class="modal-meal-bar" style="background:${mm.color}aa;">${mm.icon} ${mm.label}</div>`;
  } else {
    wrap.innerHTML = `<div class="modal-img-placeholder" style="background:${mm.bg};">${mm.icon}</div>
      <div class="modal-meal-bar" style="background:${mm.color}aa;">${mm.icon} ${mm.label}</div>`;
  }

  document.getElementById('modal-title').textContent = r.title;

  let badges = `<span class="tag tag-time">⏱ ${r.totalTime} min</span>
    <span class="tag tag-price">${r.priceLabel}</span>`;
  if (r.rating >= 4) badges += `<span class="tag tag-rating">★ ${r.rating}</span>`;
  if (r.ai_score >= AI_THRESHOLD) badges += `<span class="badge badge-ai">🌿 Score MIND ${r.ai_score}/20</span>`;
  document.getElementById('modal-badges').innerHTML = badges;
  document.getElementById('modal-desc').textContent = r.description;

  document.getElementById('modal-ings').innerHTML = r.ingredients.map(i => {
    const qty = i.quantity > 0 ? `${i.quantity} ${i.unit}` : i.unit || '';
    const opt = i.isOptional ? '<span class="ing-opt">(opt.)</span>' : '';
    return `<li class="ing-item"><span>${i.name} ${opt}</span><span class="ing-qty">${qty}</span></li>`;
  }).join('');

  document.getElementById('modal-steps').innerHTML = r.steps.map(s => `<li class="step-item">${s}</li>`).join('');

  updateModalFavBtn(num);
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function updateModalFavBtn(num) {
  const btn = document.getElementById('modal-fav-btn');
  if (btn) btn.textContent = favs.has(num) ? '❤️ Retirer des favoris' : '🤍 Ajouter aux favoris';
}

function toggleModalFav() {
  if (currentIdx === null) return;
  toggleFav(currentIdx);
  updateModalFavBtn(currentIdx);
}

// ── Favs ──────────────────────────────────
function toggleFav(num) {
  if (favs.has(num)) favs.delete(num); else favs.add(num);
  saveFavs(favs);
  renderCards();
}

function toggleFavs() {
  onlyFavs = !onlyFavs;
  document.getElementById('btn-favs').classList.toggle('active', onlyFavs);
  renderCards();
}

// ── AI filter ────────────────────────────
function toggleAI() {
  onlyAI = !onlyAI;
  document.getElementById('btn-ai').classList.toggle('ai-active', onlyAI);
  renderCards();
}

// ── Meal tabs (desktop) + Bottom nav (mobile) ────
function setMeal(meal) {
  filterMeal = meal;
  // Top tabs
  document.querySelectorAll('.meal-tab').forEach(b => b.className = 'meal-tab');
  const topBtn = document.querySelector(`.meal-tab[data-meal="${meal}"]`);
  if (topBtn) topBtn.classList.add(meal === 'all' ? 'active-all' : `active-${meal}`);
  // Bottom nav
  document.querySelectorAll('.bnav-btn').forEach(b => b.className = 'bnav-btn');
  const navBtn = document.querySelector(`.bnav-btn[data-meal="${meal}"]`);
  if (navBtn) navBtn.classList.add(meal === 'all' ? 'active' : `active-${meal}`);
  renderCards();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMealFromNav(btn) { setMeal(btn.dataset.meal); }
document.querySelectorAll('.meal-tab').forEach(btn => {
  btn.addEventListener('click', () => setMeal(btn.dataset.meal));
});

// ── Filters ──────────────────────────────
document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    const g = btn.dataset.filter;
    document.querySelectorAll(`.filter-btn[data-filter="${g}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (g === 'time')  maxTime = parseInt(btn.dataset.max);
    if (g === 'price') filterPrice = btn.dataset.price;
    renderCards();
  });
});

// ── Sort ─────────────────────────────────
document.getElementById('sort-select').addEventListener('change', e => {
  sortMode = e.target.value;
  renderCards();
});

// ── Search ───────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  query = e.target.value;
  renderCards();
});

// ── Keyboard / overlay close ─────────────
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Swipe droite pour fermer la modal ────
(function() {
  let tx = 0, ty = 0;
  const modal = document.getElementById('modal');
  modal.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    modal.style.transition = 'none';
  }, { passive: true });
  modal.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - tx;
    const dy = Math.abs(e.touches[0].clientY - ty);
    if (dx > 0 && dy < 60) modal.style.transform = `translateX(${dx}px)`;
  }, { passive: true });
  modal.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    modal.style.transition = '';
    if (dx > 80) {
      modal.style.transform = 'translateX(100%)';
      setTimeout(() => { closeModal(); modal.style.transform = ''; }, 220);
    } else {
      modal.style.transform = '';
    }
  }, { passive: true });
})();

// ── Service Worker ────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
